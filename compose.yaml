name: plan-on-call

services:
  vuejs-prod:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8080:8080"

  vuejs-dev:
    build:
      context: .
      dockerfile: app/Dockerfile.dev
    ports:
      - "5173:5173"
    develop:
      watch:
        - path: ./app/src
          target: /app/src
          action: sync
        - path: ./app/package.json
          target: /app/package.json
          action: restart
        - path: ./app/vite.config.js
          target: /app/vite.config.js
          action: restart